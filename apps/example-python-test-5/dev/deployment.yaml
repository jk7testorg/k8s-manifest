apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-python-test-5
  namespace: dev
  labels:
    app: example-python-test-5
    backstage.io/kubernetes-id: example-python-test-5
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-python-test-5
  template:
    metadata:
      labels:
        app: example-python-test-5
        backstage.io/kubernetes-id: example-python-test-5
        environment: dev
    spec:
      containers:
        - name: example-python-test-5
          image: jaykumark7/example-python-test-5:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"