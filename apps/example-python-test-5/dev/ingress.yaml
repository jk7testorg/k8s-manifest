apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-python-test-5
  namespace: dev
  labels:
    backstage.io/kubernetes-id: example-python-test-5
    environment: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx  
  rules:
    - http:
        paths:
          - path: /example-python-test-5-dev(/|$)(.*) 
            pathType: ImplementationSpecific
            backend:
              service:
                name: example-python-test-5
                port:
                  number: 80
