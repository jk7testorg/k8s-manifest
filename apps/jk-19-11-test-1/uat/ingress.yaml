apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jk-19-11-test-1
  namespace: uat
  labels:
    backstage.io/kubernetes-id: jk-19-11-test-1
    environment: uat
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /jk-19-11-test-1-uat
            pathType: Prefix
            backend:
              service:
                name: jk-19-11-test-1
                port:
                  number: 80
