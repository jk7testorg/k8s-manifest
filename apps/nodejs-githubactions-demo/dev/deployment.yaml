apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-githubactions-demo
  namespace: dev
  labels:
    app: nodejs-githubactions-demo
    backstage.io/kubernetes-id: nodejs-githubactions-demo
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-githubactions-demo
  template:
    metadata:
      labels:
        app: nodejs-githubactions-demo
        backstage.io/kubernetes-id: nodejs-githubactions-demo
        environment: dev
    spec:
      containers:
        - name: nodejs-githubactions-demo
          image: jaykumark7/nodejs-githubactions-demo:1.0.1
          ports:
            - containerPort: 3000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /nodejs-githubactions-demo-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
