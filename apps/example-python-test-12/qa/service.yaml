apiVersion: v1
kind: Service
metadata:
  name: example-python-test-12
  namespace: qa
  labels:
    backstage.io/kubernetes-id: example-python-test-12
    environment: qa
spec:
  selector:
    app: example-python-test-12
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
 


