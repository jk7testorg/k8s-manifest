apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-python-test-4
  namespace: qa
  labels:
    app: example-python-test-4
    backstage.io/kubernetes-id: example-python-test-4
    environment: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-python-test-4
  template:
    metadata:
      labels:
        app: example-python-test-4
        backstage.io/kubernetes-id: example-python-test-4
        environment: qa
    spec:
      containers:
        - name: example-python-test-4
          image: jaykumark7/example-python-test-4:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "qa"