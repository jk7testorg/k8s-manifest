apiVersion: apps/v1
kind: Deployment
metadata:
  name: jk-demo-test-3
  labels:
    app: jk-demo-test-3
    backstage.io/kubernetes-id: jk-demo-test-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jk-demo-test-3
  template:
    metadata:
      labels:
        app: jk-demo-test-3
        backstage.io/kubernetes-id: jk-demo-test-3
    spec:
      containers:
        - name: jk-demo-test-3
          image: jaykumark7/jk-demo-test-3:1.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


