apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-python-test-10
  namespace: dev
  labels:
    app: example-python-test-10
    backstage.io/kubernetes-id: example-python-test-10
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-python-test-10
  template:
    metadata:
      labels:
        app: example-python-test-10
        backstage.io/kubernetes-id: example-python-test-10
        environment: dev
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: example-python-test-10
          image: jaykumark7/example-python-test-10:1.0.12
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "100Mi"
