apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-ssp-14
  namespace: dev
  labels:
    app: java-ssp-14
    backstage.io/kubernetes-id: java-ssp-14
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-ssp-14
  template:
    metadata:
      labels:
        app: java-ssp-14
        backstage.io/kubernetes-id: java-ssp-14
        environment: dev
    spec:
      containers:
        - name: java-ssp-14
          image: jaykumark7/java-ssp-14:1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
