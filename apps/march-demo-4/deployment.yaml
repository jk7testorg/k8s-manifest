apiVersion: apps/v1
kind: Deployment
metadata:
  name: march-demo-4
  labels:
    app: march-demo-4
    backstage.io/kubernetes-id: march-demo-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: march-demo-4
  template:
    metadata:
      labels:
        app: march-demo-4
        backstage.io/kubernetes-id: march-demo-4
    spec:
      containers:
        - name: march-demo-4
          image: jaykumark7/march-demo-4:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


