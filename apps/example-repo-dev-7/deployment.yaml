apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-repo-dev-7
  labels:
    app: example-repo-dev-7
    backstage.io/kubernetes-id: example-repo-dev-7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-repo-dev-7
  template:
    metadata:
      labels:
        app: example-repo-dev-7
        backstage.io/kubernetes-id: example-repo-dev-7
    spec:
      containers:
        - name: example-repo-dev-7
          image: jaykumark7/example-repo-dev-7:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


