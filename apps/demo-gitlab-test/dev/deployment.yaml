apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-gitlab-test
  namespace: dev
  labels:
    app: demo-gitlab-test
    backstage.io/kubernetes-id: demo-gitlab-test
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-gitlab-test
  template:
    metadata:
      labels:
        app: demo-gitlab-test
        backstage.io/kubernetes-id: demo-gitlab-test
        environment: dev
    spec:
      containers:
        - name: demo-gitlab-test
          image: jaykumark7/demo-gitlab-test:1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /demo-gitlab-test-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
