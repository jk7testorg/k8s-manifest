apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dns-test-1
  namespace: dev
  labels:
    backstage.io/kubernetes-id: dns-test-1
    environment: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: dns-test-1-dev.34.29.242.32.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dns-test-1
                port:
                  number: 80
