apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-template-2
  namespace: dev
  labels:
    app: java-template-2
    backstage.io/kubernetes-id: java-template-2
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-template-2
  template:
    metadata:
      labels:
        app: java-template-2
        backstage.io/kubernetes-id: java-template-2
        environment: dev
    spec:
      containers:
        - name: java-template-2
          image: jaykumark7/java-template-2:1.0.9
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
