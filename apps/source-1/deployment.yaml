apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-1
  labels:
    app: source-1
    backstage.io/kubernetes-id: source-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: source-1
  template:
    metadata:
      labels:
        app: source-1
        backstage.io/kubernetes-id: source-1
    spec:
      containers:
        - name: source-1
          image: jaykumark7/source-1:1.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


