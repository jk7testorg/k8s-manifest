apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-test-1
  namespace: dev
  labels:
    app: springboot-test-1
    backstage.io/kubernetes-id: springboot-test-1
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-test-1
  template:
    metadata:
      labels:
        app: springboot-test-1
        backstage.io/kubernetes-id: springboot-test-1
        environment: dev
    spec:
      containers:
        - name: springboot-test-1
          image: jaykumark7/springboot-test-1:1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
