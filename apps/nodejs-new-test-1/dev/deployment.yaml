apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-new-test-1
  namespace: dev
  labels:
    app: nodejs-new-test-1
    backstage.io/kubernetes-id: nodejs-new-test-1
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-new-test-1
  template:
    metadata:
      labels:
        app: nodejs-new-test-1
        backstage.io/kubernetes-id: nodejs-new-test-1
        environment: dev
    spec:
      containers:
        - name: nodejs-new-test-1
          image: jaykumark7/nodejs-new-test-1:1.0.2
          ports:
            - containerPort: 3000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /nodejs-new-test-1-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
