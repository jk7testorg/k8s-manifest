apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-new-test-1
  namespace: dev
  labels:
    backstage.io/kubernetes-id: nodejs-new-test-1
    environment: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /nodejs-new-test-1-dev
            pathType: Prefix
            backend:
              service:
                name: nodejs-new-test-1
                port:
                  number: 80
