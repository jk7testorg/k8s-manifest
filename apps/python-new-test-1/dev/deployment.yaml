apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-new-test-1
  namespace: dev
  labels:
    app: python-new-test-1
    backstage.io/kubernetes-id: python-new-test-1
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-new-test-1
  template:
    metadata:
      labels:
        app: python-new-test-1
        backstage.io/kubernetes-id: python-new-test-1
        environment: dev
    spec:
      containers:
        - name: python-new-test-1
          image: jaykumark7/python-new-test-1:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /python-new-test-1-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
