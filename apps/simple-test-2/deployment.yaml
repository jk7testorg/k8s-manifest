apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-test-2
  labels:
    app: simple-test-2
    backstage.io/kubernetes-id: simple-test-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-test-2
  template:
    metadata:
      labels:
        app: simple-test-2
        backstage.io/kubernetes-id: simple-test-2
    spec:
      containers:
        - name: simple-test-2
          image: jaykumark7/simple-test-2:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


