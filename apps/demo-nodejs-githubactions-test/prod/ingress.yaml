apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-nodejs-githubactions-test
  namespace: prod
  labels:
    backstage.io/kubernetes-id: demo-nodejs-githubactions-test
    environment: prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /demo-nodejs-githubactions-test-prod
            pathType: Prefix
            backend:
              service:
                name: demo-nodejs-githubactions-test
                port:
                  number: 80
