apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-ssp-07
  labels:
    app: backstage-ssp-07
    backstage.io/kubernetes-id: backstage-ssp-07
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-ssp-07
  template:
    metadata:
      labels:
        app: backstage-ssp-07
        backstage.io/kubernetes-id: backstage-ssp-07
    spec:
      containers:
        - name: backstage-ssp-07
          image: jaykumark7/backstage-ssp-07:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


