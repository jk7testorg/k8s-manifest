apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-ssp-6
  namespace: dev
  labels:
    app: java-ssp-6
    backstage.io/kubernetes-id: java-ssp-6
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-ssp-6
  template:
    metadata:
      labels:
        app: java-ssp-6
        backstage.io/kubernetes-id: java-ssp-6
        environment: dev
    spec:
      containers:
        - name: java-ssp-6
          image: jaykumark7/java-ssp-6:1.0.2
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
