apiVersion: apps/v1
kind: Deployment
metadata:
  name: jk7-march-demo-7
  labels:
    app: jk7-march-demo-7
    backstage.io/kubernetes-id: jk7-march-demo-7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jk7-march-demo-7
  template:
    metadata:
      labels:
        app: jk7-march-demo-7
        backstage.io/kubernetes-id: jk7-march-demo-7
    spec:
      containers:
        - name: jk7-march-demo-7
          image: jaykumark7/jk7-march-demo-7:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


