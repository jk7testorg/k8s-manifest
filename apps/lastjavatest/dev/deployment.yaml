apiVersion: apps/v1
kind: Deployment
metadata:
  name: lastjavatest
  namespace: dev
  labels:
    app: lastjavatest
    backstage.io/kubernetes-id: lastjavatest
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lastjavatest
  template:
    metadata:
      labels:
        app: lastjavatest
        backstage.io/kubernetes-id: lastjavatest
        environment: dev
    spec:
      containers:
        - name: lastjavatest
          image: jaykumark7/lastjavatest:1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /lastjavatest-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
