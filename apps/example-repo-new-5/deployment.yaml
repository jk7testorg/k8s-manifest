apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-repo-new-5
  labels:
    app: example-repo-new-5
    backstage.io/kubernetes-id: example-repo-new-5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-repo-new-5
  template:
    metadata:
      labels:
        app: example-repo-new-5
        backstage.io/kubernetes-id: example-repo-new-5
    spec:
      containers:
        - name: example-repo-new-5
          image: jaykumark7/example-repo-new-5:1.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


