apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-jenkins-demo
  namespace: dev
  labels:
    backstage.io/kubernetes-id: python-jenkins-demo
    environment: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /python-jenkins-demo-dev
            pathType: Prefix
            backend:
              service:
                name: python-jenkins-demo
                port:
                  number: 80
