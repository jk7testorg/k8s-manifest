apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-python-app-4
  namespace: prod
  labels:
    app: example-python-app-4
    backstage.io/kubernetes-id: example-python-app-4
    environment: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-python-app-4
  template:
    metadata:
      labels:
        app: example-python-app-4
        backstage.io/kubernetes-id: example-python-app-4
        environment: prod
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: example-python-app-4
          image: jaykumark7/example-python-app-4:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "prod"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "100Mi"
