apiVersion: apps/v1
kind: Deployment
metadata:
  name: jk-demo-test-9
  labels:
    app: jk-demo-test-9
    backstage.io/kubernetes-id: jk-demo-test-9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jk-demo-test-9
  template:
    metadata:
      labels:
        app: jk-demo-test-9
        backstage.io/kubernetes-id: jk-demo-test-9
    spec:
      containers:
        - name: jk-demo-test-9
          image: jaykumark7/jk-demo-test-9:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


