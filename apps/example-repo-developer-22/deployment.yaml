apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-repo-developer-22
  labels:
    app: example-repo-developer-22
    backstage.io/kubernetes-id: example-repo-developer-22
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-repo-developer-22
  template:
    metadata:
      labels:
        app: example-repo-developer-22
        backstage.io/kubernetes-id: example-repo-developer-22
    spec:
      containers:
        - name: example-repo-developer-22
          image: jaykumark7/example-repo-developer-22:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


