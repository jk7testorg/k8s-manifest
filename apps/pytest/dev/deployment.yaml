apiVersion: apps/v1
kind: Deployment
metadata:
  name: pytest
  namespace: dev
  labels:
    app: pytest
    backstage.io/kubernetes-id: pytest
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pytest
  template:
    metadata:
      labels:
        app: pytest
        backstage.io/kubernetes-id: pytest
        environment: dev
    spec:
      containers:
        - name: pytest
          image: jaykumark7/pytest:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /pytest-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
