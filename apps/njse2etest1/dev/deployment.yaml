apiVersion: apps/v1
kind: Deployment
metadata:
  name: njse2etest1
  namespace: dev
  labels:
    app: njse2etest1
    backstage.io/kubernetes-id: njse2etest1
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: njse2etest1
  template:
    metadata:
      labels:
        app: njse2etest1
        backstage.io/kubernetes-id: njse2etest1
        environment: dev
    spec:
      containers:
        - name: njse2etest1
          image: jaykumark7/njse2etest1:1.0.1
          ports:
            - containerPort: 3000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /njse2etest1-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
