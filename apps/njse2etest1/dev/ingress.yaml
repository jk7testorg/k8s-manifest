apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: njse2etest1
  namespace: dev
  labels:
    backstage.io/kubernetes-id: njse2etest1
    environment: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /njse2etest1-dev
            pathType: Prefix
            backend:
              service:
                name: njse2etest1
                port:
                  number: 80
