apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-new-test-1
  namespace: dev
  labels:
    app: github-actions-new-test-1
    backstage.io/kubernetes-id: github-actions-new-test-1
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-actions-new-test-1
  template:
    metadata:
      labels:
        app: github-actions-new-test-1
        backstage.io/kubernetes-id: github-actions-new-test-1
        environment: dev
    spec:
      containers:
        - name: github-actions-new-test-1
          image: jaykumark7/github-actions-new-test-1:1.0.2
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /github-actions-new-test-1-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
