apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-python-app-2
  namespace: qa
  labels:
    app: example-python-app-2
    backstage.io/kubernetes-id: example-python-app-2
    environment: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-python-app-2
  template:
    metadata:
      labels:
        app: example-python-app-2
        backstage.io/kubernetes-id: example-python-app-2
        environment: qa
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: example-python-app-2
          image: jaykumark7/example-python-app-2:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "qa"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "100Mi"
