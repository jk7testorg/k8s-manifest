apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-maven-gitlab-demo
  namespace: dev
  labels:
    backstage.io/kubernetes-id: java-maven-gitlab-demo
    environment: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /java-maven-gitlab-demo-dev
            pathType: Prefix
            backend:
              service:
                name: java-maven-gitlab-demo
                port:
                  number: 80
