apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab-test-4
  namespace: dev
  labels:
    backstage.io/kubernetes-id: gitlab-test-4
    environment: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /gitlab-test-4-dev
            pathType: Prefix
            backend:
              service:
                name: gitlab-test-4
                port:
                  number: 80
