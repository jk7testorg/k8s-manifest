apiVersion: apps/v1
kind: Deployment
metadata:
  name: jk-demo-test-8
  labels:
    app: jk-demo-test-8
    backstage.io/kubernetes-id: jk-demo-test-8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jk-demo-test-8
  template:
    metadata:
      labels:
        app: jk-demo-test-8
        backstage.io/kubernetes-id: jk-demo-test-8
    spec:
      containers:
        - name: jk-demo-test-8
          image: jaykumark7/jk-demo-test-8:1.0.3
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


