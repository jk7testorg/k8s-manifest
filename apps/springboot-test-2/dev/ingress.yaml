apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: springboot-test-2
  namespace: dev
  labels:
    backstage.io/kubernetes-id: springboot-test-2
    environment: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-set-headers: "dev/springboot-test-1-headers"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /springboot-test-2-dev(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: springboot-test-2
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: springboot-test-1-headers
  namespace: dev
data:
  X-Forwarded-Prefix: "/springboot-test-1-dev"
