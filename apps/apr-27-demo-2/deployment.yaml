apiVersion: apps/v1
kind: Deployment
metadata:
  name: apr-27-demo-2
  labels:
    app: apr-27-demo-2
    backstage.io/kubernetes-id: apr-27-demo-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apr-27-demo-2
  template:
    metadata:
      labels:
        app: apr-27-demo-2
        backstage.io/kubernetes-id: apr-27-demo-2
    spec:
      containers:
        - name: apr-27-demo-2
          image: jaykumark7/apr-27-demo-2:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


