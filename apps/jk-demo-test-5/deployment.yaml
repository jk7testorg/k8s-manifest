apiVersion: apps/v1
kind: Deployment
metadata:
  name: jk-demo-test-5
  labels:
    app: jk-demo-test-5
    backstage.io/kubernetes-id: jk-demo-test-5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jk-demo-test-5
  template:
    metadata:
      labels:
        app: jk-demo-test-5
        backstage.io/kubernetes-id: jk-demo-test-5
    spec:
      containers:
        - name: jk-demo-test-5
          image: jaykumark7/jk-demo-test-5:1.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000


