apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-nodejs-githubactions-test-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jk7testorg/k8s-manifest.git
    targetRevision: main
    path: apps/demo-nodejs-githubactions-test/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
